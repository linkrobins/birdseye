    settings:
      collect_label: Collect analytics
      collect_help: >-
        Pause collection without disabling the extension. Existing stats keep
        rendering.
      license_key_label: License key
      license_key_help: >-
        From your Birdseye subscription at linkrobins.com. Without a key the
        extension records basic daily counts only, entirely locally.
      geo_ip_prefix_label: Country lookup via anonymized IP prefix
      geo_ip_prefix_help: >-
        When no proxy country header is present, keep a truncated IP prefix
        (never the full address) in the 72-hour buffer so the processor can
        resolve visitor countries. Turn off to skip country stats on
        non-proxied traffic.
