name: Backend

on:
  workflow_dispatch:
  push:
  pull_request:
  # Weekly, against the newest Flarum 2.x: there is no composer.lock, so every
  # run installs the latest core. A Flarum release that breaks this extension
  # fails here before a user reports it. The dev sweep (devsweep-stack) reads
  # the result every Thursday.
  schedule:
    - cron: '17 6 * * 3'

# The backend workflow only reads the repository.
permissions:
  contents: read

jobs:
  run:
    uses: flarum/framework/.github/workflows/REUSABLE_backend.yml@2.x
    with:
      enable_backend_testing: true
      enable_phpstan: true

      backend_directory: .
