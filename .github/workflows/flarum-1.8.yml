# Dual-major guard: the standard Backend workflow (REUSABLE_backend.yml@2.x)
# only exercises Flarum 2.0. Birdseye also supports 1.8, so this installs a real
# Flarum 1.8, drops the extension in, and asserts it enables, migrates, and
# boots without fatalling — the class of check that catches 2.0-only APIs
# leaking into the 1.8 path (e.g. an interface that doesn't exist there).
name: Flarum 1.8

on: [workflow_dispatch, push, pull_request]

jobs:
  smoke:
    name: Install + boot on Flarum 1.8
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: flarum
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout extension
        uses: actions/checkout@v4
        with:
          path: extension

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom, fileinfo, gd, json, mbstring, openssl, pdo_mysql, tokenizer, zip
          coverage: none

      - name: Create a Flarum 1.8 skeleton
        run: composer create-project flarum/flarum:^1.8 flarum --no-interaction --no-install

      - name: Require Birdseye from this checkout
        working-directory: flarum
        run: |
          composer config repositories.extension '{"type": "path", "url": "../extension", "options": {"symlink": false}}'
          composer require "linkrobins/birdseye:*" --no-interaction --with-all-dependencies

      - name: Install Flarum
        working-directory: flarum
        run: php flarum install --file ../extension/.github/flarum-install.yml

      - name: Enable, migrate, and assert a clean boot
        working-directory: flarum
        run: |
          php flarum extension:enable linkrobins-birdseye
          php flarum migrate
          php flarum cache:clear
          php flarum info | tee /tmp/info.txt
          grep -q "linkrobins-birdseye" /tmp/info.txt || { echo "Birdseye is not enabled after install"; exit 1; }

      - name: Assert the Birdseye tables were created
        working-directory: flarum
        run: |
          php -r '$c = require "config.php"; $d = $c["database"];
            $pdo = new PDO("mysql:host={$d["host"]};port={$d["port"]};dbname={$d["database"]}", $d["username"], $d["password"]);
            $t = $pdo->query("SHOW TABLES LIKE \"birdseye%\"")->fetchAll(PDO::FETCH_COLUMN);
            echo implode(", ", $t), "\n";
            if (count($t) < 2) { fwrite(STDERR, "expected birdseye_events + birdseye_rollups\n"); exit(1); }'
